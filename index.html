<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<link rel="manifest" href="manifest.json">
<title>SH Running Coach</title>
<style>
  :root{
    --paper:#0B1220; --card:#131C2B; --card2:#0F1725;
    --ink:#E8EDF5; --ink-soft:#9AA8BD; --ink-faint:#67748A;
    --line:#22304A; --line-soft:#1A2536;
    --off:#3FA57B; --flight:#5B84C4; --layover:#2FB3C7; --reserve:#E0A33C;
    --easy:#3FA57B; --easy-bg:#14291F; --long:#8A78D6; --long-bg:#221E38;
    --qual:#E8913C; --qual-bg:#33230F; --tread:#2FB3C7; --tread-bg:#0F2A31;
    --str:#C98BDA; --str-bg:#241B30; --str-line:#3A2F4D;
    --heat:#E4664C; --carb:#E0A33C; --fat:#3FA57B; --accent:#2FB3C7;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Pretendard","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:72px;}
  .app{max-width:640px;margin:0 auto;padding:14px 14px 0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px;}
  .brand{font-weight:800;font-size:18px;letter-spacing:-.01em;}
  .brand .en{font-family:var(--mono);font-size:11px;color:var(--ink-faint);font-weight:600;margin-left:6px;letter-spacing:.05em;}
  .dtag{font-family:var(--mono);font-size:11px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
  .card h2{font-size:13px;font-weight:800;margin-bottom:10px;}
  .card h3{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:9px;}
  .muted{color:var(--ink-soft);font-size:12px;}

  .strip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:3px 7px 3px 5px;}
  .strip i{width:3px;height:11px;border-radius:2px;}
  .strip.off i{background:var(--off);} .strip.flight i{background:var(--flight);}
  .strip.layover i{background:var(--layover);} .strip.reserve i{background:var(--reserve);}
  .chip{font-family:var(--mono);font-size:10px;font-weight:800;border-radius:5px;padding:2px 7px;}
  .chip.high{background:#3A2810;color:#E8A64F;border:1px solid #5A4013;}
  .chip.low{background:var(--easy-bg);color:#5FC79A;border:1px solid #224433;}
  .chip.walk{background:var(--easy-bg);color:#5FC79A;border:1px solid #224433;}
  .chip.str{background:var(--str-bg);color:var(--str);border:1px solid var(--str-line);}

  .sess{border-left:4px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card2);}
  .sess.k-easy{border-left-color:var(--easy);background:linear-gradient(90deg,var(--easy-bg),transparent 70%);}
  .sess.k-long{border-left-color:var(--long);background:linear-gradient(90deg,var(--long-bg),transparent 70%);}
  .sess.k-qual{border-left-color:var(--qual);background:linear-gradient(90deg,var(--qual-bg),transparent 70%);}
  .sess.k-tread{border-left-color:var(--tread);background:linear-gradient(90deg,var(--tread-bg),transparent 70%);}
  .sess.k-str{border-left-color:var(--str);background:linear-gradient(90deg,var(--str-bg),transparent 70%);}
  .sess.k-rest{border-left-color:var(--line);}
  .sess-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:7px;}
  .sess-tag{font-size:13px;font-weight:800;}
  .sess-meta{font-family:var(--mono);font-size:11px;color:var(--ink-soft);}
  .env{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .env span{font-family:var(--mono);font-size:10.5px;font-weight:700;border-radius:6px;padding:3px 7px;}
  .env .t{background:var(--paper);border:1px solid var(--line);color:var(--ink);}
  .env .p-out{background:var(--easy-bg);color:#5FC79A;} .env .p-tread{background:var(--tread-bg);color:#5FD3E5;} .env .p-either{background:#3A2810;color:#E8A64F;}
  .env .h{color:var(--heat);}
  .bd{display:grid;grid-template-columns:56px 1fr;gap:3px 10px;padding:2px 0;}
  .bd .l{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink-faint);padding-top:1px;}
  .bd .v{font-size:12px;} .bd .v b{font-family:var(--mono);font-weight:700;}
  .nut{display:flex;align-items:center;gap:8px;border-radius:8px;padding:6px 9px;margin-top:8px;flex-wrap:wrap;}
  .nut.high{background:#33230F;border:1px solid #5A4013;} .nut.low{background:#14291F;border:1px solid #224433;}
  .nut .nn{font-size:11px;color:var(--ink-soft);} .nut .nn b{color:var(--ink);}
  .rest-line{font-size:12.5px;color:var(--ink-soft);} .rest-line b{color:var(--ink-faint);}

  /* week */
  .wk-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;}
  .wk-nav button{flex:none;font-family:var(--mono);font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:999px;padding:6px 12px;cursor:pointer;}
  .wk-nav button.on{background:var(--accent);color:#0B1220;border-color:var(--accent);}
  .daycard{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;background:var(--card);}
  .daycard .dh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .daycard .dn{font-family:var(--mono);font-weight:700;font-size:15px;}
  .daycard .dn .dw{font-size:11px;color:var(--ink-soft);margin-left:4px;}
  .daycard.today{box-shadow:0 0 0 2px rgba(14,27,46,.14);border-color:var(--ink);}

  /* calc + settings */
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .fld{flex:1;min-width:120px;margin-bottom:10px;}
  .fld label{display:block;font-size:11px;color:var(--ink-soft);font-weight:600;margin-bottom:4px;}
  .fld input{width:100%;font-family:var(--mono);font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card2);color:var(--ink);}
  .fld input:focus{outline:none;border-color:var(--accent);}
  .btn{width:100%;font-weight:800;font-size:13px;color:#0B1220;background:var(--accent);border:none;border-radius:10px;padding:12px;cursor:pointer;margin-top:4px;}
  .btn.sec{background:var(--card);color:var(--ink-soft);border:1px solid var(--line);}
  .zone{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line-soft);font-size:12.5px;}
  .zone:first-child{border-top:none;} .zone .zn{font-weight:700;} .zone .zv{font-family:var(--mono);color:var(--ink-soft);}
  .zone .bar{height:12px;border-radius:5px;}
  .split{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .split .s{border:1px solid var(--line-soft);border-radius:8px;padding:8px 10px;text-align:center;}
  .split .s .sd{font-size:10px;color:var(--ink-faint);} .split .s .sv{font-family:var(--mono);font-weight:800;font-size:15px;margin-top:2px;}
  .saved{font-size:11px;color:var(--easy);font-weight:700;text-align:center;margin-top:8px;height:14px;}

  /* tab bar */
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 0 8px;z-index:20;}
  .tabbar .tb{flex:1;text-align:center;background:none;border:none;cursor:pointer;color:var(--ink-faint);font-size:10px;font-weight:700;padding:4px 0;}
  .tabbar .tb .ic{font-size:18px;display:block;line-height:1.3;}
  .tabbar .tb.on{color:var(--ink);}
  .hide{display:none;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">SH Running Coach<span class="en" id="verlabel">v—</span></div>
    <div class="dtag" id="dtag">—</div>
  </div>

  <section id="tab-today"></section>
  <section id="tab-week" class="hide"></section>
  <section id="tab-calc" class="hide"></section>
  <section id="tab-set" class="hide"></section>
  <section id="tab-log" class="hide"></section>
</div>

<nav class="tabbar">
  <button class="tb on" data-tab="today"><span class="ic">◎</span>오늘</button>
  <button class="tb" data-tab="week"><span class="ic">▤</span>주간</button>
  <button class="tb" data-tab="log"><span class="ic">✎</span>기록</button>
  <button class="tb" data-tab="calc"><span class="ic">∑</span>계산기</button>
  <button class="tb" data-tab="set"><span class="ic">⚙</span>설정</button>
</nav>

<script>
/* ---------- app meta ---------- */
const APP_VERSION='6.2';
const APP_BUILD='2026-08-10';

/* ---------- storage ---------- */
const DEFAULT = {
  heightCm:175, weightKg:80.4, targetKg:77,
  restHr:57, maxHr:177, atHr:135, antHr:163, cadence:170,
  startKg:81, tdee:2500, intake:1950, lat:37.28, lon:127.01,
  // paces in sec/km [fast, slow]
  easy:[435,470], recovery:[460,490], long:[440,480], threshold:[390,405], interval:[360,370],
  warmup:450, recJog:470, strideKmh:"12~13"
};
function loadProfile(){ try{ return Object.assign({}, DEFAULT, JSON.parse(localStorage.getItem('shrc_profile')||'{}')); }catch(e){ return {...DEFAULT}; } }
function saveProfile(p){ localStorage.setItem('shrc_profile', JSON.stringify(p)); }
let P = loadProfile();
function loadLogs(){ try{return JSON.parse(localStorage.getItem('shrc_logs')||'[]');}catch(e){return[];} }
function saveLogs(a){ localStorage.setItem('shrc_logs',JSON.stringify(a)); }
function loadWeights(){ try{return JSON.parse(localStorage.getItem('shrc_weights')||'[]');}catch(e){return[];} }
function saveWeights(a){ localStorage.setItem('shrc_weights',JSON.stringify(a)); }
let LOGS=loadLogs(), WEIGHTS=loadWeights();

/* ---------- calc module ---------- */
const kmh = sec => (3600/sec).toFixed(1);
const kmhRange = ([fast,slow]) => `${kmh(slow)}~${kmh(fast)} km/h`;   // slow sec = lower kmh
const pace = sec => `${Math.floor(sec/60)}'${String(Math.round(sec%60)).padStart(2,'0')}`;
const paceRange = ([fast,slow]) => `${pace(fast)}~${pace(slow)}`;
const secFmt = s => s>=60 ? `${Math.floor(s/60)}분${s%60?String(Math.round(s%60))+'초':''}` : `${Math.round(s)}초`;
const distTime = (meters, sec_per_km) => secFmt(meters/1000*sec_per_km);

function zones(p){
  return [
    {n:'이지/존2', v:`≤${p.atHr-1}`, c:'var(--easy)', w:74, d:'지방연소 · 러닝 80%'},
    {n:'템포/임계', v:`${p.atHr}~${p.atHr+15}`, c:'var(--qual)', w:84, d:'편안하게 힘든'},
    {n:'인터벌', v:`${p.antHr-8}~${p.antHr}`, c:'var(--heat)', w:92, d:'AnT 부근'},
  ];
}

/* ---------- session builders (profile-driven) ---------- */
function tm(p){ return { warm:kmh(p.warmup), rec:kmh(p.recJog) }; }
function easyRun(p, km, rec){
  const pr = rec ? p.recovery : p.easy;
  const avg=(pr[0]+pr[1])/2, mins=Math.round(km*avg/60)+4;
  return {kind:'easy', head:'이지런 · 존2'+(rec?' (회복)':''), meta:`${km}km · 약 ${mins}분`, bd:[
    ['웜업','첫 1km 걷기→조깅 점진 · 케이던스 '+p.cadence+' (러닝 구간 기준)'],
    ['메인',`${km}km @ <b>${paceRange(pr)}</b> (러닝머신 <b>${kmhRange(pr)}</b>) · <b>약 ${distTime(km*1000,pr[0])}~${distTime(km*1000,pr[1])}</b> · 심박 <b>≤${p.atHr-1}</b> · 대화 가능`],
    ['쿨다운','걷기 3~5분 + 정적 스트레칭'],
  ]};
}
function treadRun(p, km){
  const pr=p.easy;
  const trFast=Math.round((pr[0]+pr[1])/2);   // 실내는 심박 뜸 → 빠른쪽 상한을 평균(≈8.0)으로 캡
  const trPr=[trFast, pr[1]];
  const avg=(trPr[0]+trPr[1])/2, mins=Math.round(km*avg/60)+7;
  return {kind:'tread', head:'트레드밀 이지 · 존2', meta:`${km}km · 약 ${mins}분`, bd:[
    ['웜업','걷기 5분 (5.5~6.0 km/h)→조깅 점진 · 케이던스 '+p.cadence+' (러닝 구간 기준)'],
    ['메인',`${km}km @ <b>${paceRange(trPr)}</b> (<b>${kmhRange(trPr)}</b>) · 경사 1% · <b>심박 ≤${p.atHr-1} 우선</b> — 넘으면 속도↓`],
    ['쿨다운','걷기 3~5분 + 정적 스트레칭'],
    ['⚠︎ 실내보정',`실내는 바람 없어 <b>심박 5~10 높게</b> 나옴 · 페이스보다 <b>심박 사수</b> · 8.3km/h는 역치될 수 있으니 금지`],
  ]};
}
function longRun(p){
  return {kind:'long', head:'롱런 · 존2', meta:'10~12km · 약 80~100분', bd:[
    ['웜업',`첫 2km 점진 · 케이던스 ${p.cadence}`],
    ['메인',`10~12km @ <b>${paceRange(p.long)}</b> (<b>${kmhRange(p.long)}</b>) · <b>약 ${distTime(10000,p.long[0])}~${distTime(12000,p.long[1])}</b> · 심박 <b>≤${p.atHr-1}</b> · 후반 여유`],
    ['쿨다운','걷기 5분 + 스트레칭 + 전해질·단백질'],
  ]};
}
function threshold(p){
  const t=tm(p);
  return {kind:'qual', head:'임계주 (템포)', meta:'약 6km · 약 43분', bd:[
    ['웜업',`이지 조깅 10분 @${pace(p.warmup)} (러닝머신 <b>${t.warm} km/h</b>) + 스트라이드 100m×2 (개당 약 25~30초 @ ${p.strideKmh} km/h)`],
    ['메인',`20분 연속 @ <b>${paceRange(p.threshold)}</b> (러닝머신 <b>${kmhRange(p.threshold)}</b>) · <b>약 ${(1200/((p.threshold[0]+p.threshold[1])/2)).toFixed(1)}km</b> · 심박 <b>${p.atHr}~${p.atHr+15}</b>`],
    ['쿨다운',`이지 조깅 10분 @${pace(p.recJog)} (<b>${t.rec} km/h</b>) + 정적 스트레칭`],
  ]};
}
function interval(p, reps){
  const t=tm(p), mins=Math.round(23+7.5*reps);
  return {kind:'qual', head:'목표페이스 인터벌', meta:`약 ${reps+3}~${reps+4}km · 약 ${mins}분`, bd:[
    ['웜업',`이지 조깅 10분 @${pace(p.warmup)} (러닝머신 <b>${t.warm} km/h</b>)`],
    ['스트라이드',`100m × 3 · 개당 <b>약 25~30초</b> @ <b>${p.strideKmh} km/h</b> · 사이 걷기 4.5~5.0 km/h 30~60초 회복`],
    ['메인',`1km × ${reps} @ <b>${paceRange(p.interval)}</b> (러닝머신 <b>${kmhRange(p.interval)}</b>) · 1km <b>${distTime(1000,(p.interval[0]+p.interval[1])/2)}</b> (총 <b>${distTime(reps*1000,(p.interval[0]+p.interval[1])/2)}</b>) · 심박 <b>${p.antHr-8}~${p.antHr}</b>`],
    ['리커버리',`반복 사이 · 걷기 <b>5.0~5.5 km/h · 약 90초</b> (또는 300m 조깅 <b>${distTime(300,p.recJog)}</b> @ ${kmh(p.recJog)} km/h) · 심박 130대 초반까지`],
    ['쿨다운',`이지 조깅 10분 @${pace(p.warmup)} (<b>${t.warm} km/h</b>) + 정적 스트레칭`],
  ]};
}
function build(p, s){
  if(s.type==='easy') return easyRun(p, s.km, s.rec);
  if(s.type==='tread') return treadRun(p, s.km);
  if(s.type==='long') return longRun(p);
  if(s.type==='threshold') return threshold(p);
  if(s.type==='interval') return interval(p, s.reps);
  return {kind:'rest', head:'휴식 / 회복', reason:s.reason||''};
}

/* ---------- embedded plan (Phase 1 static · Aug 2026) ---------- */
const NUT = {
  high:'<b>고탄수 · 섭취 ~2,050</b> · 탄수 200~230g · 유지 근처',
  low:'<b>저탄수 · 섭취 ~1,850</b> · 탄수 130~150g · 적자일',
  rec:'<b>저탄수·회복 · 섭취 ~1,800</b> · 단백질·수분 우선'
};
const DOW=['일','월','화','수','목','금','토'];
/* ===== Phase 2 · 로스터 → 규칙 엔진 자동 생성 =====
   로스터 스키마 (일별):
   { d:일, kind:'off'|'flight'|'layover'|'reserve', label:'표시',
     sectors:섹터수, layover:'도시', nightDep:'목적지', redeye:1, early:1, coast:1, humid:1,
     heat:'낮 30°C', hint:'interval'|'threshold'|'long'|'easy'|'easyrec'|'rest', reps:4, opt:1, reason:'휴식사유' } */
const DEFAULT_ROSTER = { month:'2026-08', days:[
  {d:1,kind:'off',label:'RQOFF',hint:'rest',reason:'완전휴무 (지난주 잔여)'},
  {d:2,kind:'off',label:'RQOFF',hint:'easy',heat:'낮 34°C·열대야'},
  {d:3,kind:'flight',label:'FLT ×3',sectors:3,layover:'대구',reason:'GMP-CJU-FUK-TAE → 대구 L/O'},
  {d:4,kind:'layover',label:'L/O 대구→UBN',layover:'대구',nightDep:'UBN',heat:'대구 35°C+',opt:1},
  {d:5,kind:'flight',label:'UBN-TAE 06:20',redeye:1,reason:'새벽도착 → L/O · 회복'},
  {d:6,kind:'flight',label:'NRT 왕복+DH',sectors:2,reason:'TAE-NRT-TAE → 김포'},
  {d:7,kind:'off',label:'OFF',hint:'interval',reps:4,heat:'낮 37°C 폭염peak'},
  {d:8,kind:'flight',label:'FLT ×3',sectors:3,layover:'부산',reason:'GMP-CJU-KIX-PUS → 부산 L/O'},
  {d:9,kind:'layover',label:'L/O 부산→HKG',layover:'부산',nightDep:'HKG',coast:1,heat:'부산 31°C·습함'},
  {d:10,kind:'layover',label:'L/O 홍콩',layover:'홍콩',humid:1,heat:'홍콩 32°C·습85%+'},
  {d:11,kind:'flight',label:'HKG-PUS 06:20',redeye:1,reason:'새벽도착 +DH · 회복'},
  {d:12,kind:'off',label:'OFF',hint:'threshold',heat:'낮 32°C'},
  {d:13,kind:'flight',label:'야간 BKK',nightDep:'BKK',heat:'낮 31°C',opt:1},
  {d:14,kind:'layover',label:'L/O 방콕',layover:'방콕',humid:1,heat:'방콕 33°C·우기'},
  {d:15,kind:'flight',label:'BKK-ICN 07:40',redeye:1,reason:'새벽도착 · 회복'},
  {d:16,kind:'off',label:'RQOFF',hint:'long',heat:'낮 30°C 완화'},
  {d:17,kind:'off',label:'OFF',hint:'easyrec',heat:'낮 29°C'},
  {d:18,kind:'reserve',label:'RESV',hint:'easyrec',opt:1,heat:'낮 29°C'},
  {d:19,kind:'flight',label:'TSA 왕복',sectors:2,reason:'GMP-TSA-GMP 당일왕복'},
  {d:20,kind:'flight',label:'제주 왕복',sectors:2,reason:'제주 왕복 · 21:10 도착'},
  {d:21,kind:'flight',label:'야간 NRT',nightDep:'NRT',heat:'낮 30°C'},

// 다음날이 이른 근무(early)·레드아이·5섹터면 저녁 퀄리티 금지
function isHardNext(days,i){ const nx=days[i+1]; return !!(nx && (nx.early||nx.redeye||(nx.sectors&&nx.sectors>=5))); }
// 단순 왕복·레이오버行 → 걷기 옵션 (레드아이·이른근무·5섹터·야간출발 제외)
function walkOk(day){ return day.kind==='flight' && !day.redeye && !day.early && !day.nightDep && (day.sectors? day.sectors<=4 : true); }
function homeEnv(day, hardNext, kind){
  const heat=day.heat||'낮 30°C', extreme=/37/.test(heat);
  const quality=(kind==='interval'||kind==='threshold'), long=(kind==='long');
  let place = quality ? (extreme?'tread':'either') : (long?'out':(/34/.test(heat)?'either':'out'));
  let eve = (quality||long) ? (hardNext?'n':'y') : 'y';
  let time, note;
  if(extreme && quality){ time='새벽 05~05:30 / 저녁(실내)'; note='실내·취침 3h 전'; }
  else if(quality){ time=hardNext?'새벽 05:30~06:30':'새벽 05:30~ / 저녁 20+'; note=hardNext?'다음날 이른 show-up→새벽':'저녁 OK(취침 3h 전)'; }
  else if(long){ time=hardNext?'새벽 05~06:30':'새벽 05~06:30 / 저녁 20+'; note=hardNext?'다음날 이른 show-up→새벽':'광교호수공원·저녁 가능'; }
  else { time='새벽 / 저녁 20+'; note=/34/.test(heat)?'폭염일 새벽/실내':'새벽 or 일몰 후'; }
  return [time, place, eve, heat, note];
}
function genDay(days,i){
  const day=days[i], hardNext=isHardNext(days,i);
  const o={ dt:day.kind, duty:day.label, opt:day.opt||0, walk:false, strengthForce:day.strength||null };
  if(day.kind==='off'){
    const h=day.hint||'easy';
    if(h==='rest'){ o.carb='rec'; o.s={type:'rest',reason:day.reason||'휴식'}; return o; }
    if(h==='interval'){ o.s={type:'interval',reps:day.reps||4}; o.carb='high'; }
    else if(h==='threshold'){ o.s={type:'threshold'}; o.carb='high'; }
    else if(h==='long'){ o.s={type:'long'}; o.carb='high'; }
    else if(h==='easyrec'){ o.s={type:'easy',km:5,rec:1}; o.carb='low'; }
    else { o.s={type:'easy',km:6}; o.carb='low'; }
    o.env=homeEnv(day,hardNext,o.s.type); return o;
  }
  if(day.kind==='reserve'){ o.s={type:'easy',km:5,rec:1}; o.carb='low'; o.env=['새벽 / 저녁 20+','out','y',day.heat||'낮 29°C','대기일 · 콜 없는 시간에']; return o; }
  if(day.kind==='layover'){
    if(day.nightDep){
      if(day.coast){ o.s={type:'easy',km:5,rec:1}; o.env=['오전 06~07','either','n',day.heat||'','저녁 '+day.nightDep+' 비행 · 해안 새벽']; }
      else { o.s={type:'tread',km:4}; o.env=['오전 (현지)','tread','n',day.heat||'','저녁 '+day.nightDep+' 비행 · 실내']; }
      o.carb='high'; return o;
    }
    o.s={type:'tread',km:6}; o.carb='low'; o.env=['자유 (실내)','tread','y',day.heat||'','실내 아무 때나']; return o;
  }
  // flight
  if(day.nightDep){ o.s={type:'easy',km:5}; o.carb='high'; o.env=['오전 06~08','out','n',day.heat||'낮 30°C','저녁 '+day.nightDep+' 비행 · 오전에']; return o; }
  o.s={type:'rest',reason:day.reason||day.label}; o.walk=walkOk(day);
  o.carb = day.redeye?'rec' : (day.sectors&&day.sectors>=3)?'high' : 'low';
  return o;
}
function generatePlan(roster){
  const days=roster.days.slice().sort((a,b)=>a.d-b.d), plan={};
  days.forEach((d,i)=>{ plan[d.d]=genDay(days,i); });
  return plan;
}
function loadRoster(){ try{ return JSON.parse(localStorage.getItem('shrc_roster')||'null')||DEFAULT_ROSTER; }catch(e){ return DEFAULT_ROSTER; } }
const WEEKS=[{l:'1주',r:'8/1',days:[1]},{l:'2주',r:'8/2–8',days:[2,3,4,5,6,7,8]},{l:'3주',r:'8/9–15',days:[9,10,11,12,13,14,15]},{l:'4주',r:'8/16–22',days:[16,17,18,19,20,21,22]},{l:'5주',r:'8/23–29',days:[23,24,25,26,27,28,29]},{l:'6주',r:'8/30–31',days:[30,31]}];

/* ===== Phase 5 · 근력(플랜핏) 통합 =====
   확정된 SamLee1 플랜: Day A(상체 우세·30분) / Day B(하체 우세·40분). 주 2회.
   자동배치 규칙: 홈데이(off/reserve)에만. B(하체)는 전날·다음날·당일 퀄리티(인터벌/임계)·롱런 금지.
   A(상체)는 배치 자유(롱런일만 제외, 이지·휴식일 우선). 러닝 먼저 → 근력.
   로스터 일별 override: strength:'A'|'B'|'skip' 넣으면 자동배치보다 우선. */
const STR_TEMPLATES = {
  A:{ key:'A', plan:'플랜 1(30분)', name:'상체 우세', min:'약 30분', focus:'상체+코어',
      ex:[['트위스트 슈퍼맨','3×10','등·기립근'],['와이드 푸쉬업','3×10','가슴·삼두'],
          ['에어 레터럴 레이즈','3×30초','어깨'],['와이드 스쿼트','2×12','하체(최소)'],
          ['카프 레이즈','3×15~20','종아리'],['사이드 플랭크','3×30초 좌우','코어']] },
  B:{ key:'B', plan:'플랜 2(40분)', name:'하체 우세', min:'약 40분', focus:'하체+코어',
      ex:[['밴드 글루트 브릿지','3×12','둔근'],['사이드 킥 백','3×12 좌우','중둔근'],
          ['레그 바이셉 컬','3×10','햄스트링'],['카프 레이즈','3×15~20','종아리'],
          ['와이드 푸쉬업','3×10','가슴·삼두'],['데드 벅','3×10','코어']] },
};
const STR_START = '2026-08-17';   // 근력 시작일(YYYY-MM-DD). 시작 월엔 이 날짜부터, 이후 달은 전체 허용
function strGateDay(){
  const m=(typeof ROSTER!=='undefined'&&ROSTER&&ROSTER.month)?ROSTER.month:'';
  const sm=STR_START.slice(0,7), sd=parseInt(STR_START.slice(8),10);
  if(!m||m>sm) return 0;      // 시작 월 이후 → 게이트 없음
  if(m<sm) return 999;        // 시작 월 이전 → 전부 금지
  return sd;                  // 시작 월 → 시작일부터
}
function scheduleStrength(plan, weeks){
  const gate=strGateDay();
  const isQL = t => t==='interval'||t==='threshold'||t==='long';
  const tOf = n => plan[n]? plan[n].s.type : null;
  const home = n => plan[n] && (plan[n].dt==='off'||plan[n].dt==='reserve');
  const canB = n => { const t=tOf(n); return n>=gate && home(n) && !isQL(t) && !isQL(tOf(n-1)) && !isQL(tOf(n+1)); };
  const canA = n => n>=gate && home(n) && tOf(n)!=='long';
  Object.keys(plan).forEach(k=>{ if(plan[k]) plan[k].strength=null; });
  weeks.forEach(w=>{
    let hasA=false, hasB=false;
    w.days.forEach(n=>{ const d=plan[n]; if(!d)return; const f=d.strengthForce;
      if(f==='A'){ d.strength='A'; hasA=true; } else if(f==='B'){ d.strength='B'; hasB=true; } });
    if(!hasB){ const n=w.days.find(n=>plan[n]&&!plan[n].strength&&plan[n].strengthForce!=='skip'&&canB(n)); if(n!=null){ plan[n].strength='B'; hasB=true; } }
    if(!hasA){
      let n=w.days.find(n=>plan[n]&&!plan[n].strength&&plan[n].strengthForce!=='skip'&&canA(n)&&!isQL(tOf(n)));
      if(n==null) n=w.days.find(n=>plan[n]&&!plan[n].strength&&plan[n].strengthForce!=='skip'&&canA(n));
      if(n!=null){ plan[n].strength='A'; hasA=true; }
    }
  });
  return plan;
}
let ROSTER = loadRoster();
let PLAN = scheduleStrength(generatePlan(ROSTER), WEEKS);

/* ---------- Phase 3 · log / weight / calibration ---------- */
function sparkline(pts,w,h){
  if(pts.length<2) return '<div class="muted" style="text-align:center;padding:20px 0">체중 2개 이상 기록하면 추세 그래프</div>';
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
  const sx=x=>mxx===mnx?w/2:((x-mnx)/(mxx-mnx)*(w-14)+7);
  const sy=y=>mxy===mny?h/2:(h-8-((y-mny)/(mxy-mny)*(h-16)));
  const d=pts.map((p,i)=>(i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1)).join(' ');
  const dots=pts.map(p=>`<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="2.6" fill="#2FB3C7"/>`).join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;height:${h}px"><path d="${d}" fill="none" stroke="#2FB3C7" stroke-width="2"/>${dots}</svg>`;
}
const daysBetween=(a,b)=>(new Date(b)-new Date(a))/86400000;
const TYNAME={easy:'이지',tread:'트레드밀',long:'롱런',threshold:'임계',interval:'인터벌',walk:'걷기',strength:'근력',strengthA:'근력A',strengthB:'근력B'};
function renderLog(){
  const today=new Date().toISOString().slice(0,10);
  const W=WEIGHTS.slice().sort((a,b)=>a.date<b.date?-1:1);
  const cur=W.length?W[W.length-1].kg:P.startKg, lost=P.startKg-cur, toGo=cur-P.targetKg;
  let rate='—', sug='';
  if(W.length>=2){ const span=daysBetween(W[0].date,W[W.length-1].date)||1; const r=(W[0].kg-W[W.length-1].kg)/span*7;
    rate=(r>=0?'-':'+')+Math.abs(r).toFixed(2)+'kg/주';
    sug = Math.abs(r)<0.15 ? '정체 시 섭취 100~150↓' : r>0.9 ? '너무 빠름 — 섭취 조금↑' : '순조 — 페이스 유지';
  }
  const spark=sparkline(W.map(p=>({x:new Date(p.date).getTime(),y:p.kg})),300,70);
  let html=`<div class="card"><h2>체중</h2>

    <div style="border:1px solid var(--line-soft);border-radius:8px;padding:8px;margin-bottom:8px">${spark}</div>
    <div class="muted" style="margin-bottom:10px">시작 ${P.startKg} → 목표 ${P.targetKg} · 주간 <b style="color:var(--ink)">${rate}</b>${sug?' · '+sug:''}</div>
    <div class="row"><div class="fld" style="max-width:140px"><label>날짜</label><input id="wdate" value="${today}"></div><div class="fld" style="max-width:110px"><label>체중(kg)</label><input id="wkg" inputmode="decimal" placeholder="${cur.toFixed(1)}"></div><div class="fld" style="min-width:78px;display:flex;align-items:flex-end"><button class="btn" id="waddbtn" style="margin:0">기록</button></div></div></div>`;
  // calibration from easy logs
  const easy=LOGS.filter(l=>['easy','tread'].includes(l.type)&&l.avgHr).slice(-5);

    cal = avg>P.atHr

      : `<div class="nut low"><span class="nn">최근 이지런 평균 <b>${avg}bpm</b> — 존2 잘 지킴 (AT ${P.atHr} 이하) ✓</span></div>`;
  }

  const recent=LOGS.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,8);

  html+=`<div class="card"><h2>러닝 로그 · 자동 보정</h2>

    <button class="btn" id="laddbtn">기록 추가</button>${cal}${cal2}
    <h3 style="margin-top:12px">최근 기록</h3>${list}</div>`;
  document.getElementById('tab-log').innerHTML=analyticsHTML()+html;
  document.getElementById('waddbtn').onclick=()=>{ const kg=parseFloat(document.getElementById('wkg').value), dt=document.getElementById('wdate').value; if(!kg||!dt)return; WEIGHTS=WEIGHTS.filter(w=>w.date!==dt); WEIGHTS.push({date:dt,kg}); saveWeights(WEIGHTS); renderLog(); };
  document.getElementById('laddbtn').onclick=()=>{ const g=id=>document.getElementById(id).value; const e={date:g('ldate'),type:g('ltype'),km:parseFloat(g('lkm'))||null,min:parseFloat(g('lmin'))||null,avgHr:parseInt(g('lhr'))||null,maxHr:parseInt(g('lmhr'))||null,cadence:parseInt(g('lcad'))||null,kcal:parseInt(g('lkcal'))||null}; if(!e.date)return; LOGS.push(e); saveLogs(LOGS); renderLog(); };
}

/* ---------- Phase 4 · analytics (Garmin/Strava-style) ---------- */
// 세션 강도 계수 (TRIMP 근사): 존 기반 가중
function loadOf(l){
  if(!l.min) return 0;
  const hr=l.avgHr||0, f = hr? Math.max(1,(hr-(P.restHr||57))/Math.max(1,(P.maxHr||177)-(P.restHr||57))) : 0.5;
  const mult = l.type==='interval'?2.2 : l.type==='threshold'?1.8 : l.type==='long'?1.3 : l.type==='walk'?0.4 : (l.type&&l.type.indexOf('strength')===0)?0.6 : 1.0;
  return Math.round(l.min * (0.5+f*1.5) * mult);
}
function inWindow(l,days){ return daysBetween(l.date, new Date().toISOString().slice(0,10)) <= days; }
function analytics(){
  const recent=LOGS.filter(l=>l.date);
  const acute=recent.filter(l=>inWindow(l,7)).reduce((s,l)=>s+loadOf(l),0);
  const chronic28=recent.filter(l=>inWindow(l,28)).reduce((s,l)=>s+loadOf(l),0);
  const chronic=Math.round(chronic28/4);
  const ratio=chronic? +(acute/chronic).toFixed(2) : 0;
  let st,stc;
  if(!chronic){ st='데이터 부족'; stc='var(--ink-faint)'; }
  else if(ratio<0.8){ st='회복/디트레이닝'; stc='var(--layover)'; }
  else if(ratio<=1.3){ st='최적 (생산적)'; stc='var(--easy)'; }
  else if(ratio<=1.5){ st='과부하 주의'; stc='var(--qual)'; }
  else { st='부상 위험 (급증)'; stc='var(--heat)'; }
  // 80/20 분포 (최근 28일, 시간 기준)
  const w=recent.filter(l=>inWindow(l,28));
  let ez=0,hd=0;
  w.forEach(l=>{ if(l.type&&l.type.indexOf('strength')===0) return; const hr=l.avgHr||0; const isHard = l.type==='interval'||l.type==='threshold' || (hr && hr>=P.atHr);
    if(isHard) hd+=(l.min||0); else ez+=(l.min||0); });
  const tot=ez+hd, ezPct=tot?Math.round(ez/tot*100):0;
  // 주간 요약 (최근 7일)
  const wk=recent.filter(l=>inWindow(l,7));
  const km=wk.reduce((s,l)=>s+(l.km||0),0), min=wk.reduce((s,l)=>s+(l.min||0),0), kcal=wk.reduce((s,l)=>s+(l.kcal||0),0);
  return {acute,chronic,ratio,st,stc,ezPct,tot,km,min,kcal,cnt:wk.length};
}
function analyticsHTML(){
  const a=analytics();
  const ezOK=a.ezPct>=75, bar=(pct,c)=>`<div style="height:10px;border-radius:5px;background:var(--line-soft);overflow:hidden"><div style="height:100%;width:${pct}%;background:${c}"></div></div>`;
  return `<div class="card"><h2>주간 요약 <span class="muted" style="font-weight:500">· 최근 7일</span></h2>
    <div class="split"><div class="s"><div class="sd">거리</div><div class="sv">${a.km.toFixed(1)}<span style="font-size:10px">km</span></div></div>
    <div class="s"><div class="sd">시간</div><div class="sv">${Math.round(a.min)}<span style="font-size:10px">분</span></div></div>
    <div class="s"><div class="sd">세션</div><div class="sv">${a.cnt}</div></div></div>
    <div class="muted" style="margin-top:8px">소모 ${a.kcal.toLocaleString()} kcal</div></div>

   <div class="card"><h2>훈련 부하 <span class="muted" style="font-weight:500">· 급성/만성</span></h2>
    <div class="split" style="margin-bottom:10px"><div class="s"><div class="sd">급성 7일</div><div class="sv">${a.acute}</div></div>
    <div class="s"><div class="sd">만성 주평균</div><div class="sv">${a.chronic}</div></div>
    <div class="s"><div class="sd">비율</div><div class="sv" style="color:${a.stc}">${a.ratio||'—'}</div></div></div>
    ${bar(Math.min(100,(a.ratio/2)*100), a.stc)}
    <div class="muted" style="margin-top:8px"><b style="color:${a.stc}">${a.st}</b> · 최적 0.8~1.3 · 1.5↑ 부상위험 · 주 10% 이상 급증 주의</div></div>

   <div class="card"><h2>강도 분포 <span class="muted" style="font-weight:500">· 최근 28일</span></h2>
    ${a.tot? `${bar(a.ezPct,'var(--easy)')}
    <div class="muted" style="margin-top:8px">이지 <b style="color:var(--easy)">${a.ezPct}%</b> / 고강도 ${100-a.ezPct}% — 목표 <b>80/20</b> ${ezOK?'<span style="color:var(--easy)">✓ 잘 지킴</span>':'<span style="color:var(--heat)">이지 비중 부족 (더 느리게)</span>'}</div>`
    : '<div class="muted">기록이 쌓이면 80/20 분포 표시</div>'}</div>`;
}
/* ---------- session timer (structured steps) ---------- */
function stepsFor(day){
  const s=day.s, kmhE=kmh(P.warmup), kmhR=kmh(P.recJog);
  const iv=(P.interval[0]+P.interval[1])/2;
  if(s.type==='interval'){
    const st=[{n:'웜업 조깅',sec:600,sp:kmhE+' km/h'}];
    for(let i=0;i<3;i++){ st.push({n:`스트라이드 ${i+1}/3`,sec:28,sp:P.strideKmh+' km/h'},{n:'걷기 회복',sec:45,sp:'4.5~5.0 km/h'}); }
    for(let i=0;i<s.reps;i++){ st.push({n:`1km 반복 ${i+1}/${s.reps}`,sec:Math.round(iv),sp:kmhRange(P.interval)});
      if(i<s.reps-1) st.push({n:'걷기 회복',sec:90,sp:'5.0~5.5 km/h'}); }
    st.push({n:'쿨다운 조깅',sec:600,sp:kmhE+' km/h'});
    return st;
  }
  if(s.type==='threshold') return [{n:'웜업 조깅',sec:600,sp:kmhE+' km/h'},{n:'스트라이드 1/2',sec:28,sp:P.strideKmh+' km/h'},{n:'걷기 회복',sec:45,sp:'4.5~5.0 km/h'},{n:'스트라이드 2/2',sec:28,sp:P.strideKmh+' km/h'},{n:'걷기 회복',sec:45,sp:'4.5~5.0 km/h'},{n:'임계 20분',sec:1200,sp:kmhRange(P.threshold)},{n:'쿨다운 조깅',sec:600,sp:kmhR+' km/h'}];
  if(s.type==='tread'||s.type==='easy'){ const km=s.km||5, pr=s.rec?P.recovery:P.easy;
    return [{n:'걷기 웜업',sec:180,sp:'5.5~6.0 km/h'},{n:`이지 ${km}km`,sec:Math.round(km*((pr[0]+pr[1])/2)),sp:kmhRange(pr)},{n:'걷기 쿨다운',sec:180,sp:'5.5~6.0 km/h'}]; }
  if(s.type==='long') return [{n:'점진 웜업 2km',sec:Math.round(2*((P.long[0]+P.long[1])/2)),sp:kmhRange(P.long)},{n:'롱런 본편',sec:3600,sp:kmhRange(P.long)},{n:'걷기 쿨다운',sec:300,sp:'5.5~6.0 km/h'}];
  return null;
}
let TIMER={steps:null,i:0,left:0,run:false,h:null};
function timerHTML(){
  if(!TIMER.steps) return '';
  const s=TIMER.steps[TIMER.i], mm=String(Math.floor(TIMER.left/60)).padStart(2,'0'), ss=String(Math.max(0,TIMER.left%60)).padStart(2,'0');
  return `<div class="card" style="border-color:var(--accent)"><h3>세션 타이머 · ${TIMER.i+1}/${TIMER.steps.length}</h3>
    <div style="text-align:center;padding:6px 0 10px"><div style="font-size:14px;font-weight:800">${s.n}</div>
      <div style="font-family:var(--mono);font-size:44px;font-weight:800;line-height:1.1">${mm}:${ss}</div>
      <div class="muted" style="font-family:var(--mono)">${s.sp}</div></div>
    <div class="row"><button class="btn" id="tgo" style="flex:1">${TIMER.run?'일시정지':'시작'}</button>
      <button class="btn sec" id="tnext" style="flex:1">다음 ▸</button></div>
    <button class="btn sec" id="tstop" style="margin-top:8px">종료</button></div>`;
}
function bindTimer(day){
  const go=document.getElementById('tgo');
  if(go){
    go.onclick=()=>{ TIMER.run=!TIMER.run; if(TIMER.run) tick(); renderToday(); };
    document.getElementById('tnext').onclick=()=>{ nextStep(); renderToday(); };
    document.getElementById('tstop').onclick=()=>{ clearInterval(TIMER.h); TIMER={steps:null,i:0,left:0,run:false,h:null}; renderToday(); };
  }
  const sb=document.getElementById('startsess'); if(sb) sb.onclick=()=>startTimer(day);
}
function nextStep(){ if(!TIMER.steps) return; if(TIMER.i<TIMER.steps.length-1){ TIMER.i++; TIMER.left=TIMER.steps[TIMER.i].sec; } else { TIMER.run=false; clearInterval(TIMER.h); TIMER.steps=null; } }
function tick(){ clearInterval(TIMER.h); TIMER.h=setInterval(()=>{ if(!TIMER.run||!TIMER.steps){clearInterval(TIMER.h);return;} TIMER.left--; if(TIMER.left<=0){ try{navigator.vibrate&&navigator.vibrate(400);}catch(e){} nextStep(); } renderToday(); },1000); }
function startTimer(day){ const st=stepsFor(day); if(!st) return; TIMER={steps:st,i:0,left:st[0].sec,run:true,h:null}; tick(); renderToday(); }

async function fetchWeather(){
  const msg=document.getElementById('wxmsg'); if(msg){msg.style.color='var(--ink-soft)';msg.textContent='불러오는 중…';}
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${P.lat||37.28}&longitude=${P.lon||127.01}&daily=temperature_2m_max&timezone=Asia%2FSeoul&forecast_days=16`;
    const j=await (await fetch(url)).json();
    const map={}; (j.daily.time||[]).forEach((t,i)=>map[t]=Math.round(j.daily.temperature_2m_max[i]));
    let n=0; ROSTER.days.forEach(d=>{ const iso=`${ROSTER.month}-${String(d.d).padStart(2,'0')}`; if(map[iso]!=null){ d.heat=`낮 ${map[iso]}°C`; n++; } });
    localStorage.setItem('shrc_roster',JSON.stringify(ROSTER)); regen();
    const ta=document.getElementById('rosterjson'); if(ta) ta.value=JSON.stringify(ROSTER,null,1);
    if(msg){msg.style.color='var(--easy)';msg.textContent=`날씨 ${n}일 반영 (수원 최고기온)`;}
  }catch(e){ if(msg){msg.style.color='var(--heat)';msg.textContent='실패 — 오프라인/차단 (heat 수동 유지)';} }
}

/* ---------- tabs ---------- */
const RENDER={today:renderToday,week:renderWeek,log:renderLog,calc:renderCalc,set:renderSettings};
function show(tab){
  ['today','week','log','calc','set'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('hide',t!==tab));
  document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  RENDER[tab]();
}
document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>show(b.dataset.tab));
document.getElementById('verlabel').textContent='v'+APP_VERSION;
document.getElementById('dtag').textContent=fmtToday();
renderToday();

/* ---------- PWA service worker ---------- */
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
